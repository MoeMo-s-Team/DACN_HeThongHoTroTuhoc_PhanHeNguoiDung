[project]
name = "dacn-ai-runtime"
version = "1.0.0"
description = "Portable FastAPI adapter for the DACN AI Contract v1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "uvicorn[standard]==0.34.2",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.14.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
